    nameZh: "AI 辅助机器学习与协作方法论"
    description: "A contract-driven Rhino/Grasshopper–ANSYS chain turning scattered analysis routines into a verifiable workflow, combined with a physics-informed ML study curating ~12,000 datasets (64 features) from seven CFW projects. Handover notes, decision logs and verification matrices turned the work into a transferable human-AI collaboration method."
